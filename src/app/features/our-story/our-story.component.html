<section [id]="ids.story" class="relative overflow-hidden bg-cream py-24 sm:py-32">
  <div class="container-luxe">
    <app-section-heading [eyebrow]="copy().eyebrow" [title]="copy().title" [subtitle]="copy().subtitle" />

    <div class="relative mt-20 sm:mt-28">
      <!-- Vertical line: left on mobile, centre on desktop -->
      <div class="absolute bottom-0 left-4 top-0 w-px bg-gold/30 md:left-1/2 md:-translate-x-1/2" aria-hidden="true"></div>

      <ol class="space-y-20 md:space-y-32">
        @for (milestone of milestones(); track milestone.id; let i = $index) {
          <li class="relative grid items-center gap-8 pl-12 md:grid-cols-2 md:gap-0 md:pl-0">
            <!-- Marker -->
            <span
              class="absolute left-4 top-3 flex h-4 w-4 -translate-x-1/2 items-center justify-center md:left-1/2 md:top-1/2 md:-translate-y-1/2"
              aria-hidden="true"
            >
              <span class="h-3 w-3 rotate-45 border border-gold bg-ivory"></span>
            </span>

            <!-- Image -->
            <div class="w-full max-w-md" [class]="imageClass(i)" [appReveal]="i % 2 === 0 ? 'left' : 'right'">
              <div class="group relative">
                <div class="pointer-events-none absolute inset-0 translate-x-3 translate-y-3 border border-gold/50 transition-transform duration-700 ease-luxe group-hover:translate-x-4 group-hover:translate-y-4 sm:translate-x-4 sm:translate-y-4"></div>
                <div class="relative overflow-hidden">
                  <app-img
                    [src]="milestone.image"
                    [alt]="milestone.title"
                    class="aspect-[4/5] w-full transition-transform duration-[1200ms] ease-luxe group-hover:scale-105"
                  />
                </div>
              </div>
            </div>

            <!-- Text -->
            <div class="flex flex-col" [class]="textClass(i)" appReveal [revealDelay]="150">
              <span class="font-display text-6xl leading-none text-gold/70 sm:text-7xl">{{ milestone.year }}</span>
              @if (milestone.dateLabel) {
                <span class="eyebrow mt-3">{{ milestone.dateLabel }}</span>
              }
              <h3 class="heading-serif mt-3 text-3xl sm:text-4xl">{{ milestone.title }}</h3>
              <p class="mt-4 max-w-md font-sans text-[0.95rem] leading-relaxed text-cocoa/80 sm:text-base">
                {{ milestone.description }}
              </p>
            </div>
          </li>
        }
      </ol>
    </div>
  </div>
</section>
